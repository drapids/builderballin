<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builderballin</title>
<meta name="description" content="Build custom maps for Hyperballin and play them in game with Hyperboi.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#17152a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Unbounded:wght@800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&text=%E3%83%93%E3%83%AB%E3%83%80%E3%83%BC%E3%83%9C%E3%83%BC%E3%83%AA%E3%83%B3&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="js/loader.js" defer></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div class="loader" id="loader" aria-hidden="true"><canvas id="loaderCanvas" width="192" height="120"></canvas><div class="loader-brand"><span class="brand-name">BUILDERBALLIN'</span><span class="brand-kana" lang="ja">ビルダーボーリン</span></div><div class="loader-line"><i id="loaderBar"></i></div></div>
<div class="app" id="app">
  <header class="bar" data-enter>
    <div class="brand">
      <span class="brand-marble" aria-hidden="true"></span>
      <span class="brand-text"><span class="brand-name">BUILDERBALLIN'</span><span class="brand-kana" lang="ja">ビルダーボーリン</span></span>
    </div>
    <input id="mapName" class="mapname" spellcheck="false" aria-label="Map name">
    <div class="spacer"></div>
    <div class="bar-group menu-group">
      <button class="btn ghost" id="homeBtn" title="Templates, your maps and game setup (Ctrl+N)">Home</button>
      <button class="btn ghost" id="openBtn" title="Open a map (Ctrl+O)">Open</button>
      <button class="btn ghost" id="importBtn">Import</button>
      <button class="btn ghost" id="settingsBtn">Settings</button>
      <button class="icon-btn" id="helpBtn" title="Keyboard shortcuts" aria-label="Keyboard shortcuts"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h1M10 10h1M14 10h1M18 10h0M7 14h10"/></svg></button>
    </div>
    <div id="gameSlot" class="game-slot"></div>
    <button class="btn line" id="exportBtn">Export</button>
    <button class="btn primary play-game" id="playGameBtn" hidden><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>Play in game</button>
    <input type="file" id="fileInput" accept=".hbmap,.json,application/json" hidden>
    <input type="file" id="importInput" multiple hidden>
  </header>

  <aside class="tray" data-enter>
    <div class="cats" id="cats" role="tablist"></div>
    <div class="search"><input id="pieceSearch" placeholder="Find a piece" aria-label="Find a piece"></div>
    <div class="pieces" id="pieces"></div>
    <p class="tray-note" id="trayNote"></p>
  </aside>

  <main class="stage" id="stage">
    <canvas id="view"></canvas>
    <div class="toolbar" data-enter>
      <div class="bar-group">
        <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
        <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
      </div>
      <div class="seg" id="toolSeg" role="radiogroup" aria-label="Tool">
        <button data-tool="select" title="Select (V)">Select</button>
        <button data-tool="translate" title="Move (W)">Move</button>
        <button data-tool="rotate" title="Rotate (E)">Rotate</button>
        <button data-tool="scale" title="Scale (R)">Scale</button>
        <span class="seg-thumb"></span>
      </div>
    </div>
    <div class="viewbar" data-enter>
      <button data-view="persp" class="on">3D</button>
      <button data-view="top">Top</button>
      <button data-view="side">Side</button>
      <button data-view="frame" title="Frame everything (F with nothing selected)">Frame all</button>
      <span class="vb-gap"></span>
      <button id="ditherBtn" title="The game draws everything through a dither filter. This copies it">Dither</button>
    </div>
    <div class="placing" id="placing" hidden>
      <span class="placing-name" id="placingName"></span>
      <span class="placing-help">Click to place, drag to paint. Alt + scroll changes height. Esc stops.</span>
      <span class="placing-height" id="placingHeight"></span>
    </div>
    <div class="marquee" id="marquee" hidden></div>
    <div class="drop" id="drop" hidden><div>Drop a map to open it<small>or a PNG, Minecraft build, .vox or 3D model to bring it in</small></div></div>
  </main>

  <aside class="inspector" id="inspector" data-enter></aside>

  <footer class="timeline" data-enter>
    <button class="play" id="playBtn" aria-label="Play preview" title="Watch spawners and motion (Space)"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4.5v15l12-7.5z"/></svg></button>
    <div class="time" id="timeText">0.0 s</div>
    <input type="range" class="scrub" id="scrub" min="0" max="12" step="0.01" value="0" aria-label="Preview time">
    <label class="mini-toggle" title="Show triggered motion as if its trigger already fired"><input type="checkbox" id="fireTriggers"> Triggers fired</label>
    <div class="divider"></div>
    <label class="mini-select">Grid <select id="gridSel"><option value="500">5 m</option><option value="1000" selected>10 m</option><option value="2500">25 m</option><option value="5000">50 m</option><option value="10000">100 m</option></select></label>
    <label class="mini-select">Angle <select id="angleSel"><option value="0">Free</option><option value="5">5°</option><option value="15" selected>15°</option><option value="45">45°</option><option value="90">90°</option></select></label>
    <label class="mini-toggle"><input type="checkbox" id="snapChk" checked> Snap</label>
    <div class="divider"></div>
    <div class="stat" id="statText"></div>
    <div class="saved" id="savedText"></div>
  </footer>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
